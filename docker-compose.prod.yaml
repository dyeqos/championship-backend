services:
  nest-app:
    depends_on:
      - mongo-db
    build:
      context: .
      dockerfile: Dockerfile
    image: championship-docker
    container_name: championship-docker
    restart: always # reiniciar el contenedor si se detiene
    ports:
      - '${PORT}:${PORT}'
    environment:
      MONGO_DB: ${MONGO_DB}
      NAME_DB: ${NAME_DB}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}

  mongo-db:
    image: mongo:6.0.26-jammy
    container_name: mongo-championship
    restart: always
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_DATABASE: championship-db
      MONGO_INITDB_ROOT_USERNAME: dcalvi
      MONGO_INITDB_ROOT_PASSWORD: 123456
    volumes:
      - ./mongo:/data/db
